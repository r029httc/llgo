name: Go

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./... && go vet -tags solution ./...
      - name: 測試（你的練習進度）
        run: go test -race ./...
      - name: 測試（參考解答，確保題目本身正確）
        run: go test -race -tags solution ./...
